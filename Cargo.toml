[package]
name = "cert-egui"
version = "0.1.0"
authors = ["lucy-dot-dot"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = "0.34.2"
egui = "0.34.2"
zip = "8.6.0"
dirs = "6.0.0"
fake = { version = "5.1.0", features = ["url", "http"] }
log = "0.4.29"
env_logger = "0.11.10"
time = { version = "0.3.4", features = ["local-offset", "formatting", "macros"] }
rcgen = { version = "0.14.8", features = ["pem"] }
rsa = { version = "0.9.10", features = ["sha2"] }
rand = "0.10.1"

[build-dependencies]
winresource = "0.1.27"

[profile.release]
lto = true
strip = true

[[bin]]
name = "certificate-request-generator"
path = "src/main.rs"