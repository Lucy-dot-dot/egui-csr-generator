[package]
name = "cert-egui"
version = "0.1.0"
authors = ["lucy-dot-dot"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"]}
egui = { version = "0.35.0", default-features = false, features = ["default_fonts"] }

zip = "8.6.0"
dirs = "6.0.0"
fake = { version = "5.1.0", features = ["url", "http"] }
log = "0.4.33"
env_logger = "0.11.11"
time = { version = "0.3.54", features = ["local-offset", "formatting", "macros"] }
rcgen = { version = "0.14.8", features = ["pem"] }
rsa = { version = "0.9.10", features = ["sha2"] }
rand = "0.10.2"
rfd = "0.17.2"

[build-dependencies]
winresource = "0.1.27"

[profile.release]
lto = true
strip = true

[[bin]]
name = "certificate-request-generator"
path = "src/main.rs"